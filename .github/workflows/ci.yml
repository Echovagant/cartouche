name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 取消同一分支上更早的未完成构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 契约 / 基准 / 许可 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 GDAL（conda-forge）
        # GDAL 是系统级预编译二进制，不走 npm；CI 必须真的装上，
        # 否则样本生成与引擎冒烟测试会变成"永远绿"的假验证。
        #
        # 三个平台差异坑（2026-10-22 修，2026-10-24 再修一个）：
        #   1. `conda create` 只建环境、不激活，$CONDA_PREFIX 在这一步里是空的；
        #      环境实际落在 <base>/envs/gdal，前缀要用 `conda info --base` 取。
        #   2. conda 的目录布局分平台：Windows 是 <prefix>\Library\bin，
        #      Linux 是 <prefix>/bin。这里跑在 ubuntu-latest 上，只能用后者。
        #   3. **runner 镜像不再预装 conda**（2026-10-24 实测：某次运行在这一步
        #      直接以 `conda: command not found`（exit 127）收场，后面 13 步全被
        #      skipped —— CI 对"代码对不对"就不再给信号了）。所以这里自己装一份
        #      Miniconda，不依赖镜像自带，也不引入第三方 GitHub Action。
        run: |
          set -eo pipefail
          # gdal 钉在小版本上（3.13.x）：门禁断言的是 GDAL 的**已知行为**
          # （比如"同名 .prj 对栅格无效"）。不钉版本的话，conda-forge 哪天
          # 出了 3.14 且行为变了，CI 就会因为一件跟代码无关的事变红——
          # 那种红是噪声，不是信号。升版本时请显式改这里，并同步复核那几条检查。
          MINICONDA_HOME="$HOME/miniconda3"
          if [ ! -x "$MINICONDA_HOME/bin/conda" ]; then
            curl -fsSL -o /tmp/miniconda.sh \
              https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
            bash /tmp/miniconda.sh -b -p "$MINICONDA_HOME"
            echo "$MINICONDA_HOME/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$MINICONDA_HOME/bin:$PATH"
          conda create -y -n gdal -c conda-forge gdal=3.13 proj geos
          CONDA_BASE="$(conda info --base)"
          GDAL_ROOT="$CONDA_BASE/envs/gdal"
          echo "GDAL_BIN=$GDAL_ROOT/bin" >> "$GITHUB_ENV"
          if [ -d "$GDAL_ROOT/share/gdal" ]; then
            echo "GDAL_DATA=$GDAL_ROOT/share/gdal" >> "$GITHUB_ENV"
            echo "PROJ_LIB=$GDAL_ROOT/share/proj" >> "$GITHUB_ENV"
            echo "PROJ_DATA=$GDAL_ROOT/share/proj" >> "$GITHUB_ENV"
          fi
          # 用 $GITHUB_PATH 把 GDAL 的 bin 追加进 PATH。
          # 千万别写 `env: PATH: ${{ env.GDAL_BIN }}:${{ env.PATH }}`：
          # env 上下文里没有 runner 默认的 PATH，${{ env.PATH }} 会展开成空串，
          # 于是 PATH 被清成只剩一个不存在的目录，npm 找不到 sh，
          # 直接以 "enoent spawn sh ENOENT" 收场。
          echo "$GDAL_ROOT/bin" >> "$GITHUB_PATH"
          echo "GDAL_BIN=$GDAL_ROOT/bin" >> "$GITHUB_STEP_SUMMARY"

      - name: 类型检查
        run: npm run typecheck

      - name: 打印运行时版本（排查平台差异用）
        run: |
          node --version
          npm --version
          node -p "JSON.stringify(process.versions)"

      # 样本生成必须排在单元测试**之前**：
      # 有几个测试直接读 fixtures/ 下由 `npm run fixture` 生成的样本
      # （embedded.tff / worldref.tff 等），没先生成就跑不起来。
      # 2026-10-21：步骤顺序反了，CI 第一次跑就挂在单元测试上。
      - name: 样本生成与写回往返校验
        run: npm run fixture

      - name: 单元测试
        # 串行执行：并行跑多个测试文件会同时拉起十几个 GDAL 子进程，
        # 在 Windows 上偶发文件锁/扫描竞争（实测 5 轮里偶发 1 次失败）。
        # 本地开发可用 `npm test`（并行，快），CI 用这个确定性的串行档。
        run: npm run test:ci

      - name: 契约自检（操作计划 Schema）
        run: npm run check:schema

      - name: 基准集自检（30 条 AI 用例）
        run: npm run check:bench

      - name: 依赖许可门禁
        run: node scripts/check-licenses.mjs

      - name: 密钥扫描门禁（防 API Key 误提交）
        # 本项目规定 API Key 不进仓库、不以明文保存；
        # 这一步是最后一道防线，防止有人把 key 粘进源码/文档后推上去。
        run: npm run check:secrets

      - name: 编码污染扫描（UTF-8 被按 GBK 解码后又存回）
        run: npm run scan:encoding

      - name: 引擎冒烟测试
        run: npm run smoke:engine

      - name: 构建前端静态站点
        run: npm run build:web

      - name: 构建引擎与服务端
        run: npm run build:server

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-static
          path: web/out
          retention-days: 7
